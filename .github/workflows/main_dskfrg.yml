name: Build and Deploy Streamlit App to Azure Web App - dskfrg

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Use stable version for Streamlit compatibility

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifact (exclude venv)
        run: |
          mkdir deploy
          cp -r * deploy/
          rm -rf deploy/venv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: streamlit-app
          path: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4F1310EF05E242F5AA3D5F582497786A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B5653B5E309A46DA878371DC1EECF1AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_970E64E9CBD24F61B83DAAE6E59588AB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dskfrg'
          slot-name: 'Production'
          package: .
          startup-command: 'streamlit run your_app.py --server.port=$PORT --server.address=0.0.0.0'
